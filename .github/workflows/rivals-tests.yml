name: Rivals portable tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, nvst/rivals-foundation]

jobs:
  rivals-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up C++ compiler
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Build portable Rivals tests
        run: g++ -std=c++20 -O1 -g -Wall -Imods/coop -o /tmp/rivals_tests tests/rivals_tests.cpp
      - name: Run portable Rivals tests
        run: /tmp/rivals_tests
